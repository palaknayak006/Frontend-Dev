<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Multi-API Dashboard (Q4)</title>
<style>.skeleton{background:#eee;height:24px;width:150px;margin:8px 0}</style>
</head>
<body>
  <h2>Dashboard</h2>
  <div id="dashboard">
    <div id="u">Users: <span class="skeleton"></span></div>
    <div id="o">Orders: <span class="skeleton"></span></div>
    <div id="p">Products: <span class="skeleton"></span></div>
  </div>
  <div id="warn" style="color:orange"></div>

<script>
const base = 'http://localhost:3004';
const endpoints = ['/users','/orders','/products'];

function loadAll(){
  document.getElementById('warn').textContent = '';
  // show skeletons (already present)
  Promise.all(endpoints.map(ep =>
    fetch(base + ep).then(r => {
      if(!r.ok) throw new Error('Failed ' + ep);
      return r.json();
    })
  ))
  .then(([users, orders, products]) => {
    document.getElementById('u').innerHTML = 'Users: ' + users.length;
    document.getElementById('o').innerHTML = 'Orders: ' + orders.length;
    document.getElementById('p').innerHTML = 'Products: ' + products.length;
  })
  .catch(err => {
    // Try to load individually to show partial data
    document.getElementById('warn').textContent = 'Some data could not be loaded.';
    // load individually with graceful degradation
    fetch(base + '/users').then(r=>r.ok?r.json():[]).then(data=>document.getElementById('u').innerHTML='Users: '+(data.length||0));
    fetch(base + '/orders').then(r=>r.ok?r.json():[]).then(data=>document.getElementById('o').innerHTML='Orders: '+(data.length||0));
    fetch(base + '/products').then(r=>r.ok?r.json():[]).then(data=>document.getElementById('p').innerHTML='Products: '+(data.length||0));
  });
}

loadAll();
</script>
</body>
</html>
