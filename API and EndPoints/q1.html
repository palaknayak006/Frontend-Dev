<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Live Product Search (Q1)</title>
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <style>
    #results img{width:80px;height:80px}
    .loading{font-style:italic;color:#666}
    .product{display:flex;gap:10px;padding:8px;border-bottom:1px solid #eee}
  </style>
</head>
<body>
  <h2>Live Search</h2>
  <input id="search" placeholder="Search products..." autocomplete="off" />
  <div id="status"></div>
  <div id="results"></div>

<script>
$(function(){
  const $search = $('#search'), $results = $('#results'), $status = $('#status');
  let ajaxReq = null;

  function render(items){
    $results.empty();
    if(!items || items.length===0){ $results.text('No products found'); return; }
    items.forEach(p=>{
      $results.append(
        $('<div class="product">').append(
          $('<img>').attr('src', p.image),
          $('<div>').append($('<div>').text(p.name), $('<div>').text('₹'+p.price))
        )
      );
    });
  }

  $search.on('input', function(){
    const q = $(this).val().trim();
    if(ajaxReq){ ajaxReq.abort(); }
    if(q === ''){
      $results.empty();
      $status.empty();
      return;
    }
    $status.html('<span class="loading">Loading...</span>');
    ajaxReq = $.ajax({
      url: 'http://localhost:3001/products',
      data: { q: q },
      method: 'GET',
      success: function(data){
        render(data);
      },
      error: function(_, status){
        if(status !== 'abort') $results.text('Error loading results');
      },
      complete: function(){ $status.empty(); ajaxReq = null; }
    });
  });
});
</script>
</body>
</html>
