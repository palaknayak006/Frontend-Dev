<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Task Manager (Q3)</title>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<style>.task{padding:8px;border-bottom:1px solid #eee}</style>
</head>
<body>
  <h2>Tasks</h2>
  <label>Sort/Filter:
    <select id="filter">
      <option value="">All</option>
      <option value="priority=Low">Low Priority</option>
      <option value="priority=Medium">Medium Priority</option>
      <option value="priority=High">High Priority</option>
      <option value="completed=true">Completed</option>
    </select>
  </label>
  <div id="list"></div>

<script>
const base = 'http://localhost:3003/tasks';
function load(q=''){
  $('#list').html('Loading...');
  $.ajax({
    url: base + (q ? '?' + q : ''),
    method: 'GET',
    success: function(data){
      render(data);
    },
    error: function(){ $('#list').text('Error loading tasks'); }
  });
}

function render(tasks){
  const $list = $('#list').empty();
  if(!tasks || tasks.length===0) { $list.text('No tasks found'); return; }
  tasks.forEach(t=>{
    const $div = $('<div class="task">');
    const $cb = $('<input type="checkbox">').prop('checked', t.completed);
    $cb.on('change', ()=> toggleCompleted(t.id, $cb.prop('checked')));
    $div.append($cb, ' ', $('<strong>').text(t.title + ' '), '('+t.priority+')');
    $list.append($div);
  });
}

function toggleCompleted(id, done){
  $.ajax({
    url: base + '/' + id,
    method: 'PATCH',
    contentType: 'application/json',
    data: JSON.stringify({ completed: done }),
    success: function(){ /* UI already updated via checkbox */ },
    error: function(){ alert('Failed to update task'); load($('#filter').val()); }
  });
}

$('#filter').on('change', function(){
  const q = $(this).val();
  load(q);
});

load();
</script>
</body>
</html>
