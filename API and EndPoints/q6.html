<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Registration</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <h2>Register</h2>
  <form id="form">
    <input name="name" placeholder="Name" required /><br/>
    <input name="email" placeholder="Email" type="email" required /><br/>
    <button type="submit">Register</button>
  </form>
  <div id="msg"></div>

<script>
const base = 'http://localhost:3006/users';

document.getElementById('form').addEventListener('submit', function(e){
  e.preventDefault();
  const form = e.target;
  const name = form.name.value.trim();
  const email = form.email.value.trim();
  const msg = document.getElementById('msg');
  msg.textContent = 'Checking...';

  // Check if email already exists
  axios.get(base + '?email=' + encodeURIComponent(email))
    .then(resp => {
      if(resp.data && resp.data.length > 0){
        msg.textContent = 'Email already registered.';
      } else {
        // Register new user
        axios.post(base, { name, email })
          .then(() => msg.textContent = 'Registration successful.')
          .catch(() => msg.textContent = 'Registration failed.');
      }
    })
    .catch(()=> msg.textContent = 'Error checking email.');
});
</script>
</body>
</html>
